name: Publish libraries to Maven Central

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CENTRAL_PUBLISHING_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      CENTRAL_PUBLISHING_PASSWORD: ${{ secrets.SONATYPE_TOKEN }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java, Maven and Sonatype credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: CENTRAL_PUBLISHING_USERNAME
          server-password: CENTRAL_PUBLISHING_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish sb-repl-bridge to Maven Central
        run: mvn -B -f sb-repl-bridge/pom.xml -Pcentral deploy

      - name: Publish sb-repl-agent to Maven Central
        run: mvn -B -f sb-repl-agent/pom.xml -Pcentral deploy

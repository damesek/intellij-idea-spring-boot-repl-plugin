name: Verify plugin and runtime
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - name: Check repository links and release versions
        run: |
          python3 scripts/check-repository.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/check-repository.py --release-tag "$GITHUB_REF_NAME"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, run regression tests and build the installable plugin
        run: ./gradlew --no-daemon check buildPlugin -PtestJdk=${{ matrix.java }}
      - name: Verify the same plugin artifact against IDEA 2025.2 (Community and Ultimate)
        if: matrix.java == 21
        run: ./gradlew --no-daemon verifyPlugin -PtestJdk=21
      - name: Verify the previous supported IDEs separately
        if: matrix.java == 21
        run: ./gradlew --no-daemon verifyPlugin -PtestJdk=21 -PverifyPreviousIdes=true
      - name: Verify Maven agent and bridge packaging without publishing
        if: matrix.java == 21
        run: |
          mvn -B -f sb-repl-agent/pom.xml package -Dgpg.skip=true
          agent_version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("sb-repl-agent/pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')
          python3 scripts/check-agent-package.py "sb-repl-agent/target/sb-repl-agent-${agent_version}.jar"
          mvn -B -f sb-repl-bridge/pom.xml package -Dgpg.skip=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-jdk-${{ matrix.java }}
          path: |
            build/distributions/*.zip
            build/reports/
            dev-runtime/build/reports/
